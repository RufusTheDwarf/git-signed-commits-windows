<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Git Signed Commits on Windows</title>
  <desc id="desc">Terminal-inspired banner in graphite, electric green and cyan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d12"/>
      <stop offset="1" stop-color="#111b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c896"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#9fb3c8" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="298" rx="21" fill="none" stroke="#30414b"/>
  <path d="M0 245H1200" stroke="url(#accent)" stroke-width="3" opacity=".9"/>
  <path d="M0 248H1200" stroke="#00c896" stroke-width="10" opacity=".08"/>
  <g transform="translate(68 76)">
    <rect width="1064" height="148" rx="14" fill="#0b1117" stroke="#334650" stroke-width="1.5"/>
    <path d="M0 38H1064" stroke="#334650"/>
    <circle cx="24" cy="19" r="5" fill="#fb7185"/><circle cx="44" cy="19" r="5" fill="#fbbf24"/><circle cx="64" cy="19" r="5" fill="#00c896"/>
    <g font-family="Consolas, 'Courier New', monospace">
      <text x="88" y="25" font-size="12" fill="#80939e">PowerShell / Git Bash</text>
      <text x="34" y="83" font-size="17" fill="#00c896">&gt;</text>
      <text x="60" y="83" font-size="17" fill="#d7e2e8">git config --global gpg.format ssh</text>
      <text x="34" y="115" font-size="15" fill="#38bdf8">[ VERIFIED ]</text>
      <text x="174" y="115" font-size="15" fill="#8fa3ad">Commit signatures, configured on Windows</text>
    </g>
    <g transform="translate(905 65)" filter="url(#glow)">
      <path d="M0 10L22 0L44 10V35L22 46L0 35Z" fill="none" stroke="#00c896" stroke-width="2.5"/>
      <path d="M12 23L19 30L33 15" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="68" y="53" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="3" fill="#38bdf8">WINDOWS SECURITY GUIDE</text>
  <text x="68" y="278" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2" fill="#8da2ad">SSH KEY  /  GIT SIGNING  /  GITHUB VERIFICATION</text>
  <text x="1132" y="278" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#00c896">ED25519</text>
</svg>
