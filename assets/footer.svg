<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Git Signed Commits on Windows footer</title>
  <desc id="desc">A terminal-inspired footer with green and cyan security accents.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c896"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#9fb3c8" opacity=".18"/>
    </pattern>
  </defs>
  <rect width="1200" height="150" rx="18" fill="#0b1117"/>
  <rect width="1200" height="150" rx="18" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="148" rx="17" fill="none" stroke="#30414b"/>
  <rect x="0" y="0" width="1200" height="3" rx="2" fill="url(#line)"/>
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="48" y="53" font-size="13" letter-spacing="3" fill="#38bdf8">END OF DOCUMENTATION</text>
    <text x="48" y="87" font-size="23" font-weight="700" fill="#e2e8f0">Signed commits. Verifiable history.</text>
    <text x="48" y="116" font-size="12" fill="#8da2ad">Keep your private key private. Verify before you trust.</text>
    <text x="1150" y="57" text-anchor="end" font-size="12" fill="#00c896">[ SSH ]</text>
    <text x="1150" y="81" text-anchor="end" font-size="12" fill="#38bdf8">[ GIT ]</text>
    <text x="1150" y="105" text-anchor="end" font-size="12" fill="#8da2ad">[ WINDOWS ]</text>
  </g>
</svg>
